interface:
  display_name: "轨迹生图 Skill"
  short_description: "运行时发现生图能力，低成本逐张预绘地标，再以两图模式生成路线图"
  default_prompt: "使用 $trail-image-generation-skill 处理这个轨迹包：各阶段必须写入同一份路线核对单。完成基础信息、打卡点和主照片确认后，先只读发现当前Agent实际生图能力；未知模型、尺寸、质量、价格和参考图容量必须写unknown，不得按模型名猜测。分别选择landmark_prepaint和route_final执行器并分别授权。每次只上传一张原图，优先请求provider已确认的较小方形尺寸和low/fast/draft档；原始输出尺寸如实记录，必要时另行生成默认512×512拼板标准稿。地标稿不生成点位编号，原图中已确认的牌匾、石刻和地标名称允许参考保留，不得新增不存在的文字。组成审核板并等待“地标简化稿确认无误”。随后生成SVG、PNG和布局JSON；三项资产必须共同记录已确认起终点，SVG显示完整名称，PNG至少显示清晰的起点/终点角色，不能依赖最终模型猜测。第4阶段逐图确认画面风格、数量、文字、轨迹精度、背景环境和地标连接方式；默认采用干净无连线构图，地域背景仅在用户确认后作为低对比P1远景加入；并为每张路线图从已确认简化稿中确定性生成最多12格的地标参考板。最终提示词必须区分实际上传参考图、参考板编号映射、素材事实来源和不上传的校验资产，并强制写明点位完整性、点位对应和地标连接方式：轨迹锚点、编号、名称和地标必须逐项一一对应且不能漏点；默认不画地标引导连线，只用相同编号、名称和邻近布局对应，除非用户明确要求连线。选择后期添加文字时仍须逐项列出全部正式文字及其排版区域，不得用类别概括。收到“生图提示词确认无误”后重新发现并选择route_final执行器；实际上传最多两张，第一张必须是route_geometry轨迹PNG，第二张只能是可选landmark_reference_board。外部上传前必须确认。"
