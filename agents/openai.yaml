interface:
  display_name: "轨迹生图 Skill"
  short_description: "默认严格遵循真实轨迹，核对点位后生成可校验的路线图提示词"
  default_prompt: "使用 $trail-image-generation-skill 处理这个轨迹包：依次完成基础信息确认、打卡点和主照片确认、SVG 与 PNG 路线参考生成；第4阶段强制确认画面风格、生图数量（默认1张）、每张图片的全部文字和轨迹精度（默认精确轨迹/严格遵循轨迹）；之后才输出生图基础信息摘要、画面规格确认和逐张独立完整提示词。必须把每张最终提示词全文展示给用户，收到“生图提示词确认无误”后才能选择提供方或生图。每张提示词必须原样包含几何锁定区和文字锁定区；正式生图前必须把轨迹 PNG 作为最高优先级几何参考，生成并校验执行清单，且不得缩写已确认提示词。默认模型 gpt-image-2，外部上传前必须确认。"
