interface:
  display_name: "轨迹生图工作流"
  short_description: "保留路线基础数据，按标注优先解析照片，发现轨迹/照片热点，确认打卡点主图，计算路线强度并生成路线地图"
  default_prompt: "使用 $trail-image-prompt 处理这个轨迹包：先核对基础信息和路线强度，再按元数据标注优先筛选照片，自动重点检查轨迹异常聚集、局部折返、停留和照片密集区域，确认打卡点及标志性主图；点位优先模式先生成小尺寸打卡点图，用户确认后跳过总览图，直接生成详图；如果当前 Agent 没有生图模型，或用户指定其他生图模型，则只输出可直接复制的独立生图提示词和参考素材清单。"
